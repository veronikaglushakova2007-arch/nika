services:
  app:
    image: php:8.3-cli
    container_name: student_app
    working_dir: /var/www
    volumes:
      - ./src:/var/www
    networks:
      - student-network

  db:
    image: mariadb:10.11
    container_name: student_db
    environment:
      MYSQL_DATABASE: students
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    networks:
      - student-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: student_pma
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    networks:
      - student-network

networks:
  student-network:
    driver: bridge
